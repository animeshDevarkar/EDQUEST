<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>API Integration Fundamentals - Local Dashboard</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --text: #f8fafc;
      --muted: #94a3b8;
      --success: #22c55e;
      --error: #ef4444;
      --border: #334155;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 2rem; }
    .container { max-width: 1000px; margin: 0 auto; }
    header { margin-bottom: 2rem; border-bottom: 1px solid var(--border); padding-bottom: 1rem; }
    h1 { color: var(--accent); font-size: 2rem; margin-bottom: 0.5rem; }
    p.subtitle { color: var(--muted); }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }
    @media (max-width: 768px) { .grid { grid-template-columns: 1fr; } }
    .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; padding: 1.5rem; }
    h2 { font-size: 1.25rem; margin-bottom: 1rem; border-bottom: 1px solid var(--border); padding-bottom: 0.5rem; color: #e2e8f0; }
    .preset-btn { background: #334155; color: #f8fafc; border: none; padding: 0.5rem 1rem; border-radius: 6px; cursor: pointer; margin-right: 0.5rem; margin-bottom: 0.5rem; font-size: 0.875rem; transition: background 0.2s; }
    .preset-btn:hover { background: var(--accent); color: #0f172a; }
    .form-group { margin-bottom: 1rem; }
    label { display: block; margin-bottom: 0.25rem; font-size: 0.875rem; color: var(--muted); }
    input, select, textarea { width: 100%; background: #0f172a; border: 1px solid var(--border); color: #fff; padding: 0.6rem; border-radius: 6px; font-family: monospace; font-size: 0.9rem; }
    button.submit-btn { width: 100%; background: var(--accent); color: #0f172a; font-weight: bold; border: none; padding: 0.75rem; border-radius: 6px; cursor: pointer; font-size: 1rem; transition: background 0.2s; }
    button.submit-btn:hover { background: var(--accent-hover); color: #fff; }
    .badge { display: inline-block; padding: 0.25rem 0.6rem; border-radius: 4px; font-size: 0.8rem; font-weight: bold; }
    .badge-200 { background: rgba(34, 197, 94, 0.2); color: var(--success); border: 1px solid var(--success); }
    .badge-404, .badge-500 { background: rgba(239, 68, 68, 0.2); color: var(--error); border: 1px solid var(--error); }
    pre { background: #0f172a; border: 1px solid var(--border); padding: 1rem; border-radius: 6px; overflow-x: auto; font-family: monospace; font-size: 0.85rem; color: #a5f3fc; max-height: 400px; }
    .metrics { display: flex; gap: 1rem; margin-bottom: 1rem; }
    .metric-box { background: #0f172a; padding: 0.75rem; border-radius: 6px; flex: 1; border: 1px solid var(--border); text-align: center; }
    .metric-val { font-size: 1.1rem; font-weight: bold; color: var(--accent); }
    .metric-lbl { font-size: 0.75rem; color: var(--muted); }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>📡 API Integration Fundamentals Dashboard</h1>
      <p class="subtitle">Interactive Local Testing Environment | EDQUEST Assignment</p>
    </header>

    <div class="grid">
      <!-- Request Config Panel -->
      <div class="card">
        <h2>🛠️ Request Configuration</h2>
        
        <div style="margin-bottom: 1rem;">
          <label>Quick Load Presets:</label>
          <button class="preset-btn" onclick="loadPreset('user')">GET User Profile</button>
          <button class="preset-btn" onclick="loadPreset('weather')">GET Pune Weather</button>
          <button class="preset-btn" onclick="loadPreset('post')">POST New Post</button>
          <button class="preset-btn" onclick="loadPreset('err404')">404 Error Test</button>
        </div>

        <div class="form-group">
          <label>HTTP Method:</label>
          <select id="method">
            <option value="GET">GET</option>
            <option value="POST">POST</option>
            <option value="PUT">PUT</option>
            <option value="DELETE">DELETE</option>
          </select>
        </div>

        <div class="form-group">
          <label>Target API Endpoint URL:</label>
          <input type="text" id="url" value="https://jsonplaceholder.typicode.com/users/1">
        </div>

        <div class="form-group">
          <label>JSON Request Body (POST/PUT):</label>
          <textarea id="body" rows="4" placeholder='{"key": "value"}'></textarea>
        </div>

        <button class="submit-btn" onclick="executeApiCall()">🚀 Send API Request</button>
      </div>

      <!-- Response Panel -->
      <div class="card">
        <h2>📊 API Response Inspector</h2>
        
        <div class="metrics">
          <div class="metric-box">
            <div class="metric-lbl">STATUS</div>
            <div class="metric-val" id="res-status">-</div>
          </div>
          <div class="metric-box">
            <div class="metric-lbl">LATENCY</div>
            <div class="metric-val" id="res-duration">-</div>
          </div>
        </div>

        <div class="form-group">
          <label>Response Body (JSON / Parsed Object):</label>
          <pre id="res-body">// Click "Send API Request" or pick a preset to view output</pre>
        </div>
      </div>
    </div>
  </div>

  <script>
    const presets = {
      user: { method: 'GET', url: 'https://jsonplaceholder.typicode.com/users/1', body: '' },
      weather: { method: 'GET', url: 'https://api.open-meteo.com/v1/forecast?latitude=18.5204&longitude=73.8567&current_weather=true', body: '' },
      post: { method: 'POST', url: 'https://jsonplaceholder.typicode.com/posts', body: JSON.stringify({ title: 'API Integration Fundamentals', body: 'Testing local POST requests', userId: 1 }, null, 2) },
      err404: { method: 'GET', url: 'https://jsonplaceholder.typicode.com/users/99999', body: '' }
    };

    function loadPreset(key) {
      const p = presets[key];
      document.getElementById('method').value = p.method;
      document.getElementById('url').value = p.url;
      document.getElementById('body').value = p.body;
    }

    async function executeApiCall() {
      const method = document.getElementById('method').value;
      const url = document.getElementById('url').value;
      const bodyRaw = document.getElementById('body').value;

      document.getElementById('res-status').innerText = 'Loading...';
      document.getElementById('res-duration').innerText = '...';
      document.getElementById('res-body').innerText = 'Sending HTTP request to proxy...';

      let body = null;
      if (bodyRaw.trim()) {
        try { body = JSON.parse(bodyRaw); } catch(e) { body = bodyRaw; }
      }

      try {
        const res = await fetch('/api/test-fetch', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ method, url, body })
        });
        const data = await res.json();

        const badgeClass = data.status >= 200 && data.status < 300 ? 'badge-200' : 'badge-404';
        document.getElementById('res-status').innerHTML = `<span class="badge ${badgeClass}">${data.status} ${data.statusText}</span>`;
        document.getElementById('res-duration').innerText = data.duration;
        document.getElementById('res-body').innerText = JSON.stringify(data.data, null, 2);
      } catch (err) {
        document.getElementById('res-status').innerHTML = `<span class="badge badge-500">ERROR</span>`;
        document.getElementById('res-duration').innerText = '0ms';
        document.getElementById('res-body').innerText = `Failed to execute request: ${err.message}`;
      }
    }
  </script>
</body>
</html>
