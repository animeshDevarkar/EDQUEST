name: Continuous Integration & Deployment Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build & Automated Testing
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Execute Automated Jest Tests with Coverage
        run: npm run test:coverage

      - name: Upload Test Coverage Artifacts
        uses: actions/upload-artifact@v4
        if: matrix.node-version == '20.x'
        with:
          name: code-coverage-report
          path: coverage/

  deploy-staging:
    name: Deploy to Staging Environment
    needs: build-and-test
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Staging Deployment Simulated Hook
        run: |
          echo "Deploying build commit ${{ github.sha }} to STAGING environment..."
          echo "Health check verification passed: HTTP 200 OK"

  deploy-production:
    name: Deploy to Production Environment
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Production Deployment Simulated Hook
        run: |
          echo "Deploying release commit ${{ github.sha }} to PRODUCTION environment..."
          echo "Zero-downtime rolling update completed successfully."
